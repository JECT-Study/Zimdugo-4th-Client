name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다.
# PR 에 연속으로 푸시할 때 오래된 실행이 러너를 붙잡고 있지 않도록.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 설치·포맷·테스트만 한다. 저장소에 쓸 일이 없다.
# 명시하지 않으면 저장소 기본값(쓰기일 수 있다)이 그대로 들어온다.
permissions:
  contents: read

jobs:
  verify:
    name: lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        # PR 코드가 pnpm install 과 테스트에서 실행된다. 토큰을 로컬 git 설정에
        # 남겨 둘 이유가 없다. 이 잡은 추가 git 작업을 하지 않는다.
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 포맷·린트·import 정렬. 로컬에서는 `pnpm check` 와 같다.
      - name: Biome
        run: pnpm check

      # 타입 체크는 paraglide 가 만든 메시지 타입을 필요로 한다.
      - name: Compile messages
        run: pnpm --filter web i18n:compile && pnpm --filter admin i18n:compile

      - name: Typecheck
        run: pnpm typecheck

      # 각 앱의 pretest 가 paraglide 메시지를 먼저 컴파일한다.
      - name: Test (web)
        run: pnpm test:web

      - name: Test (admin)
        run: pnpm test:admin
