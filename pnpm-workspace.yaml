packages:
  - 'apps/*'
  - 'packages/*'
# pnpm 11: fresh clone 시 install 단계에서 패키지 postinstall/build 스크립트 실행 허용.
# 아래만 명시적으로 허용(신뢰하는 네이티브 빌드 의존성). 목록 변경 시 보안·유지보수 검토 필요.
# - @prisma/engines: Prisma 엔진 네이티브 바이너리
# - esbuild: 번들러 네이티브 바이너리
# - prisma: 스키마/엔진 빌드 단계
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@tanstack/react-router-ssr-query@1.167.2'
  - '@tanstack/router-ssr-query-core@1.169.2'

# 전이 의존성의 취약 버전을 끌어올린다. 상위 패키지가 아직 낡은 범위를 가리켜
# 여기서 강제하지 않으면 install 마다 취약 버전이 다시 내려온다.
# 메이저는 넘기지 않는다. 지금 트리에 실제로 있는 것만 적는다 -- 없는 패키지에
# 핀을 걸어 두면 맞는지 확인할 길이 없다.
overrides:
  brace-expansion: ^5.0.9
  defu: ^6.1.5
  esbuild: ^0.28.1
  js-yaml: ^4.3.1
  kysely: ^0.28.17
  launch-editor: ^2.14.1
  nanoid: ^3.3.18
  picomatch@4: ^4.0.4
  postcss: ^8.5.23
  seroval: ^1.5.3
  shell-quote: ^1.9.0
  # uuid 10 은 10.0.0 하나뿐이라 그 줄기에는 고칠 버전이 없다. 소비자인
  # @lix-js/sdk 가 ^10.0.0 을 선언하고 있어 메이저를 넘기는 셈인데, 쓰는 건
  # v4·v7·validate 뿐이고 11 에서도 같은 이름으로 그대로 있다. 실제로 불러
  # 확인했고 paraglide compile 도 통과한다.
  uuid@10: ^11.1.1
  uuid@13: ^13.0.1
  # vitest 가 vite 7.3.1 을 따로 붙잡아 vite 가 두 벌 깔린다. 그러면 플러그인
  # 타입이 서로 다른 vite 를 가리켜 vitest.config.ts 타입 검사가 깨진다.
  vite: ^7.3.5
  ws: ^8.21.0
