packages:
  - 'apps/*'
  - 'packages/*'
# pnpm 11: fresh clone 시 install 단계에서 패키지 postinstall/build 스크립트 실행 허용.
# 아래만 명시적으로 허용(신뢰하는 네이티브 빌드 의존성). 목록 변경 시 보안·유지보수 검토 필요.
# - @prisma/engines: Prisma 엔진 네이티브 바이너리
# - esbuild: 번들러 네이티브 바이너리
# - prisma: 스키마/엔진 빌드 단계
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@tanstack/react-router-ssr-query@1.167.2'
  - '@tanstack/router-ssr-query-core@1.169.2'

# 전이 의존성의 취약 버전을 끌어올린다. 상위 패키지가 아직 낡은 범위를 가리켜
# 여기서 강제하지 않으면 install 마다 취약 버전이 다시 내려온다.
# 메이저는 넘기지 않는다. 지금 트리에 실제로 있는 것만 적는다 -- 없는 패키지에
# 핀을 걸어 두면 맞는지 확인할 길이 없다.
overrides:
  baseline-browser-mapping: ^2.11.0
  brace-expansion: ^5.0.9
  browserslist: ^4.28.7
  defu: ^6.1.5
  esbuild: ^0.28.1
  js-yaml: ^4.3.2
  kysely: ^0.28.17
  launch-editor: ^2.14.1
  # nitro 의 db0 가 선택 피어로 둔 드라이버다. 취약한 3.15 가 lockfile 에 깔려
  # 있었는데, 하한을 올리면 pnpm 이 선택 피어를 새로 깔지 않아 트리에서 빠진다.
  # 앱은 DB 드라이버를 쓰지 않는다. 이 줄을 지우면 3.15 가 다시 깔린다.
  mysql2: ^3.23.1
  nanoid: ^3.3.18
  picomatch@4: ^4.0.4
  postcss: ^8.5.23
  # @tanstack/router-core 가 끌어오는 seroval-plugins 1.8 이 seroval ^1.8.0 을
  # 요구한다(seroval/shared 하위 경로). 하한이 낮으면 seroval 이 1.6 에 남아 빌드가 깨진다.
  seroval: ^1.8.0
  shell-quote: ^1.9.0
  source-map-js: ^1.2.2
  # uuid 10 은 10.0.0 하나뿐이라 그 줄기에는 고칠 버전이 없다. 소비자인
  # @lix-js/sdk 가 ^10.0.0 을 선언하고 있어 메이저를 넘기는 셈인데, 쓰는 건
  # v4·v7·validate 뿐이고 11 에서도 같은 이름으로 그대로 있다. 실제로 불러
  # 확인했고 paraglide compile 도 통과한다.
  uuid@10: ^11.1.1
  uuid@13: ^13.0.1
  # vitest 등이 자기 범위 안의 다른 vite 를 붙잡으면 vite 가 두 벌 깔린다. 그러면
  # 플러그인 타입이 서로 다른 vite 를 가리켜 vitest.config.ts 타입 검사가 깨진다.
  # 앱이 쓰는 vite 와 같은 범위로 묶어 한 벌만 남긴다.
  vite: ^8.3.8
  ws: ^8.21.0
